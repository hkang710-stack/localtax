<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로컬링크 — 지역 상세</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --primary:#ff385c; --primary-active:#e00b41;
  --ink:#222; --body:#3f3f3f; --muted:#6a6a6a; --muted-soft:#929292;
  --hairline:#ddd; --hairline-soft:#ebebeb; --canvas:#fff; --surface:#f7f7f7;
  --shadow:rgba(0,0,0,.02) 0 0 0 1px, rgba(0,0,0,.04) 0 2px 6px 0, rgba(0,0,0,.1) 0 4px 8px 0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--body);
  font-family:'Inter','Noto Sans KR',-apple-system,system-ui,Roboto,'Helvetica Neue',sans-serif}
nav{height:80px;border-bottom:1px solid var(--hairline-soft);display:flex;align-items:center;padding:0 24px}
.nav-in{max-width:820px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:20px;font-weight:700;color:var(--primary);letter-spacing:-.3px;text-decoration:none}
.back{font-size:14px;color:var(--muted);text-decoration:none}
main{max-width:820px;margin:0 auto;padding:36px 24px 64px}
h1{font-size:28px;font-weight:600;color:var(--ink);letter-spacing:-.4px;margin:0}
.sub{font-size:15px;color:var(--muted);margin:6px 0 0}
.hero{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin:20px 0 0;border-radius:14px;overflow:hidden}
.hero.single{grid-template-columns:1fr}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .main-ph{aspect-ratio:16/10}
.hero .side{display:grid;gap:8px}
.hero .side img{aspect-ratio:16/9.7}
.hero-fallback{aspect-ratio:16/7;border-radius:14px;background:var(--surface);border:1px solid var(--hairline-soft);
  display:flex;align-items:center;justify-content:center;margin:20px 0 0}
.section{padding:24px 0;border-bottom:1px solid var(--hairline-soft)}
.section h2{font-size:18px;font-weight:600;color:var(--ink);margin:0 0 12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;padding:5px 12px;border-radius:9999px;background:var(--canvas);
  border:1px solid var(--hairline);box-shadow:var(--shadow);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:8px;margin-top:16px}
.stats .v{font-size:17px;font-weight:600;color:var(--ink);margin:0}
.stats .l{font-size:12px;color:var(--muted);margin:2px 0 0}
.dot{display:inline-block;width:6px;height:6px;border-radius:9999px;vertical-align:middle;margin-left:4px}
.dot.live{background:#008a05}.dot.mock{background:var(--hairline)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:9px 15px;border-radius:9999px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;
  border:1px solid var(--hairline);background:var(--canvas);color:var(--body)}
.chips button.on{border-color:var(--ink);background:var(--ink);color:#fff}
input[type=range]{width:100%;accent-color:var(--primary)}
.sale-row{display:flex;align-items:baseline;justify-content:space-between;margin-top:8px}
.sale-row .big{font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-.4px}
.sale-row .small{font-size:14px;color:var(--muted)}
.result{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.result .box{border:1px solid var(--hairline);border-radius:14px;box-shadow:var(--shadow);padding:16px}
.result .k{font-size:12px;color:var(--muted);margin:0}
.result .n{font-size:24px;font-weight:700;margin:4px 0 0;color:var(--ink)}
.result .n.hl{color:var(--primary)}
.chart{display:flex;gap:14px;align-items:flex-end;height:140px;margin-top:20px;padding:0 4px}
.chart .yr{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:0;text-align:center}
.chart .bars{display:flex;gap:3px;align-items:flex-end;height:110px}
.chart .bar{flex:1;border-radius:3px 3px 0 0}
.chart .bar.before{background:var(--hairline)}
.chart .bar.after{background:var(--ink)}
.chart .lbl{font-size:11px;color:var(--muted);margin-top:6px}
.legend{font-size:12px;color:var(--muted);margin-top:8px}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin:0 4px 0 10px}
.note{background:var(--surface);border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.55;color:var(--muted);margin-top:20px}
.story{font-size:15px;line-height:1.7;color:var(--body)}
.cta{display:block;text-align:center;text-decoration:none;margin-top:24px;height:48px;line-height:48px;border-radius:8px;
  background:var(--primary);color:#fff;font-size:16px;font-weight:500}
.cta:active{background:var(--primary-active)}
.loading{padding:48px;color:var(--muted);font-size:15px}
footer{border-top:1px solid var(--hairline-soft);padding:24px}
.foot-in{max-width:820px;margin:0 auto;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.hero .side{display:none}}
</style>
</head>
<body>
<nav><div class="nav-in">
  <a class="logo" href="/">로컬링크</a>
  <a class="back" href="/">← 지역 탐색으로</a>
</div></nav>

<main id="main"><div class="loading">지역 정보를 불러오는 중이에요…</div></main>

<footer><div class="foot-in">
  <span>로컬링크 — 청년과 지역을 잇습니다</span>
  <span>출처: 소상공인시장진흥공단 · 온통청년 · KOSIS · 사진: 한국관광공사 · 추정치는 참고용이에요</span>
</div></footer>

<script>
"use strict";

/* ── 세금 계산 (조특법 §6, 2026년 이후 창업·청년 기준) ── */
var BRACKETS = [
  [14000000, 0.06], [50000000, 0.15], [88000000, 0.24],
  [150000000, 0.35], [300000000, 0.38], [500000000, 0.40],
  [1000000000, 0.42], [Infinity, 0.45]
];
function incomeTax(base) {
  if (base <= 0) return 0;
  var tax = 0, prev = 0;
  for (var i = 0; i < BRACKETS.length; i++) {
    var cap = BRACKETS[i][0], rate = BRACKETS[i][1];
    var slice = Math.min(base, cap) - prev;
    if (slice > 0) tax += slice * rate;
    if (base <= cap) break;
    prev = cap;
  }
  return tax;
}
var CAP = 500000000; // 연간 감면 한도 5억 (2026년 이후 창업)
var GROWTH = 5;      // 연 매출 성장 가정 %
var INDUSTRIES = {
  "음식점": { margin: 15, daily: 40 },
  "카페·디저트": { margin: 12, daily: 30 },
  "온라인 쇼핑몰": { margin: 10, daily: 40 },
  "미용·뷰티": { margin: 22, daily: 25 },
  "학원·교습소": { margin: 25, daily: 30 },
  "게스트하우스·숙박": { margin: 20, daily: 25 },
  "공방·소규모 제조": { margin: 15, daily: 20 },
  "IT·콘텐츠 제작": { margin: 40, daily: 20 }
};
function fmtMan(won) { return Math.round(won / 10000).toLocaleString() + "만 원"; }

var region = null;
var calc = { industry: "음식점", daily: 40 };

function simulate() {
  var rows = [], cum = 0;
  var margin = INDUSTRIES[calc.industry].margin;
  for (var y = 1; y <= 5; y++) {
    var sales = calc.daily * 10000 * 30 * 12 * Math.pow(1 + GROWTH / 100, y - 1);
    var profit = sales * margin / 100;
    var tax = incomeTax(Math.max(0, profit - 1500000)) * 1.1;
    var saved = Math.min(tax * region.benefit.rate, CAP);
    cum += saved;
    rows.push({ tax: tax, saved: saved, after: tax - saved, cum: cum });
  }
  return rows;
}

function srcDot(s) { return '<span class="dot ' + (s === "live" ? "live" : "mock") + '"></span>'; }

function renderCalc() {
  var rows = simulate();
  var maxTax = Math.max.apply(null, rows.map(function (r) { return r.tax; })) || 1;
  var chips = Object.keys(INDUSTRIES).map(function (n) {
    return '<button data-ind="' + n + '" class="' + (calc.industry === n ? "on" : "") + '">' + n + "</button>";
  }).join("");
  var bars = rows.map(function (r, i) {
    return '<div class="yr"><div class="bars">' +
      '<div class="bar before" style="height:' + Math.max(4, r.tax / maxTax * 100) + '%"></div>' +
      '<div class="bar after" style="height:' + Math.max(2, r.after / maxTax * 100) + '%"></div>' +
      '</div><div class="lbl">' + (i + 1) + "년차</div></div>";
  }).join("");
  document.getElementById("calc").innerHTML =
    '<h2>내 조건으로 계산해 보기</h2>' +
    '<p style="font-size:13px;color:var(--muted-soft);margin:0 0 14px">만 34세 이하 청년 창업 기준(병역 기간 최대 6년 차감) · ' +
    region.name + '은 소득세 <b style="color:var(--ink)">' + region.benefit.rate * 100 + '% 감면</b> 지역이에요.</p>' +
    '<p style="font-size:14px;font-weight:600;color:var(--ink);margin:0 0 8px">무슨 일을 하실 건가요?</p>' +
    '<div class="chips" id="indChips">' + chips + "</div>" +
    '<p style="font-size:14px;font-weight:600;color:var(--ink);margin:20px 0 8px">하루에 얼마 정도 팔면 될 것 같으세요?</p>' +
    '<input type="range" id="daily" min="5" max="150" step="5" value="' + calc.daily + '">' +
    '<div class="sale-row"><span class="big">하루 ' + calc.daily + '만 원</span>' +
    '<span class="small">월매출 약 ' + (calc.daily * 30).toLocaleString() + "만 원</span></div>" +
    '<div class="result">' +
    '<div class="box"><p class="k">1년차 아끼는 세금</p><p class="n">' + fmtMan(rows[0].saved) + "</p></div>" +
    '<div class="box"><p class="k">5년 누적 절감액</p><p class="n hl">' + fmtMan(rows[4].cum) + "</p></div></div>" +
    '<div class="chart">' + bars + "</div>" +
    '<p class="legend">연도별 소득세<span class="sw" style="background:var(--hairline)"></span>감면 전<span class="sw" style="background:var(--ink)"></span>감면 후</p>' +
    '<div class="note">' + calc.industry + ' 업종의 통상 순이익률(' + INDUSTRIES[calc.industry].margin + '%)과 연 ' + GROWTH +
    '% 성장을 가정한 추정이에요. 소득이 처음 난 해부터 5년 감면, 지방소득세 10% 포함, 연간 감면 한도 5억 원 반영. ' +
    '부가가치세·4대 보험료는 감면 대상이 아니며, 실제 적용은 업종·요건에 따라 달라 세무사 확인이 필요해요.</div>';
}

function render() {
  var r = region;
  var photos = r.photos || [];
  var hero;
  if (photos.length >= 3) {
    hero = '<div class="hero"><img class="main-ph" src="' + photos[0] + '" alt="' + r.name + '">' +
      '<div class="side"><img src="' + photos[1] + '"><img src="' + photos[2] + '"></div></div>';
  } else if (photos.length >= 1) {
    hero = '<div class="hero single"><img class="main-ph" src="' + photos[0] + '" alt="' + r.name + '"></div>';
  } else {
    hero = '<div class="hero-fallback"><span style="color:var(--muted-soft);font-size:14px">아직 이 지역 사진이 준비되지 않았어요</span></div>';
  }
  var tags = '<span class="tag">소득세 ' + r.benefit.rate * 100 + '% 감면 · 청년 기준</span>';
  if (r.benefit.popDecline) tags += '<span class="tag">인구감소지역</span>';
  if (r.benefit.ozRound) tags += '<span class="tag">기회발전특구 ' + r.benefit.ozRound + "차</span>";
  var pol = "";
  if (r.policyTop && r.policyTop.length) {
    pol = '<div class="section"><h2>이 지역 청년정책</h2>' +
      r.policyTop.map(function (p) { return '<p style="font-size:14px;margin:4px 0">· ' + p + "</p>"; }).join("") + "</div>";
  }
  document.getElementById("main").innerHTML =
    '<h1>' + r.sido + " " + r.name + '</h1>' +
    '<p class="sub">' + r.benefit.tier + "</p>" + hero +
    '<div class="section"><div class="tags">' + tags + "</div>" +
    '<div class="stats">' +
    '<div><p class="v">' + r.rent + "만" + srcDot(r.sources.rent) + '</p><p class="l">임대료 (3.3㎡ 월)</p></div>' +
    '<div><p class="v">' + r.storeCount.toLocaleString() + srcDot(r.sources.storeCount) + '</p><p class="l">음식점 수</p></div>' +
    '<div><p class="v">' + r.youthRatio + "%" + srcDot(r.sources.youthRatio) + '</p><p class="l">청년 비율</p></div>' +
    '<div><p class="v">' + r.policyCount + "개" + srcDot(r.sources.policyCount) + '</p><p class="l">청년정책</p></div>' +
    "</div></div>" +
    '<div class="section" id="calc"></div>' +
    '<div class="section"><h2>이 지역 이야기</h2><p class="story">' + r.story + "</p></div>" + pol +
    '<a class="cta" href="/">다른 지역과 비교해 보기</a>';
  renderCalc();
}

document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-ind]");
  if (b) {
    calc.industry = b.getAttribute("data-ind");
    calc.daily = INDUSTRIES[calc.industry].daily;
    renderCalc();
  }
});
document.addEventListener("input", function (e) {
  if (e.target.id === "daily") { calc.daily = Number(e.target.value); renderCalc(); }
});

var id = new URLSearchParams(location.search).get("id");
fetch("/api/regions")
  .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(function (j) {
    region = j.regions.find(function (x) { return x.id === id; }) || j.regions[0];
    document.title = "로컬링크 — " + region.sido + " " + region.name;
    render();
  })
  .catch(function (e) {
    document.getElementById("main").innerHTML =
      '<div class="loading"><b style="color:var(--ink)">지역 정보를 불러오지 못했어요</b><br>' + e.message + "</div>";
  });
</script>
</body>
</html>
